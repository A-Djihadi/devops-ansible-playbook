---
- name: Copie du docker-compose depuis le template Jinja2
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: restart app

- name: Pull des images Docker
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    pull: always
    state: absent   # Pull sans démarrer

- name: Déploiement de la stack
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
