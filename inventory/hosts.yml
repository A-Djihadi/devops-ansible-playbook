---
# Inventaire Ansible — hosts fictifs à remplacer par tes serveurs réels.
# Format YAML (alternative à hosts.ini, plus lisible pour les grands inventaires).

all:
  children:
    webservers:
      hosts:
        web-01:
          ansible_host: 192.168.1.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        web-02:
          ansible_host: 192.168.1.11
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    dbservers:
      hosts:
        db-01:
          ansible_host: 192.168.1.20
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519

  vars:
    ansible_python_interpreter: /usr/bin/python3
